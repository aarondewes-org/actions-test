name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Print actor
        run: echo ${{ github.actor }}
      - name: Print JSON
        run: echo ${{ toJSON (github.event) }}
